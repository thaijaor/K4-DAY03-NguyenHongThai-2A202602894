<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1040" viewBox="0 0 1900 1040" font-family="'Segoe UI', 'Be Vietnam Pro', Roboto, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3d4a43"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6d3fd1"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#17693f"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0b3d25" flood-opacity=".12"/>
    </filter>
    <symbol id="badge" viewBox="-12 -12 24 24" overflow="visible"><circle r="12" fill="#0f5132"/></symbol>
  </defs>

  <rect width="1900" height="1040" fill="#f4f7f2"/>

  <!-- Title -->
  <text x="40" y="50" font-size="30" font-weight="800" fill="#0b3d25">🏸 SmashHub · Kiến trúc ReAct Agent + MCP</text>
  <text x="40" y="80" font-size="15" fill="#5d6b63">Trợ lý đặt sân cầu lông: vòng lặp Thought → Action → Observation, gọi tool qua MCP Server (JSON-RPC 2.0)</text>

  <!-- ================= CLI ================= -->
  <g filter="url(#sh)">
    <rect x="40" y="100" width="260" height="120" rx="14" fill="#ffffff" stroke="#cfd8d2"/>
  </g>
  <text x="60" y="130" font-size="12" font-weight="700" fill="#6b7b71" letter-spacing="1">TERMINAL</text>
  <text x="60" y="156" font-size="17" font-weight="700" fill="#102017">CLI · src/app.py</text>
  <text x="60" y="180" font-size="13" fill="#33443a" font-family="Consolas, monospace">--all · 6 test cases</text>
  <text x="60" y="202" font-size="13" fill="#33443a">→ docs/trace_waterfall.json</text>

  <!-- ================= UI ================= -->
  <g filter="url(#sh)">
    <rect x="40" y="270" width="260" height="290" rx="14" fill="#ffffff" stroke="#bcd0ff"/>
  </g>
  <rect x="40" y="270" width="260" height="8" rx="4" fill="#2563eb"/>
  <text x="60" y="306" font-size="12" font-weight="700" fill="#2563eb" letter-spacing="1">TRÌNH DUYỆT</text>
  <text x="60" y="332" font-size="17" font-weight="700" fill="#102017">Demo Web UI</text>
  <text x="60" y="352" font-size="12.5" fill="#6b7b71" font-family="Consolas, monospace">demo/static</text>
  <text x="60" y="392" font-size="14" fill="#33443a">💬 Chat với agent</text>
  <text x="60" y="422" font-size="14" fill="#33443a">🏸 Lịch sân live</text>
  <text x="84" y="442" font-size="12.5" fill="#6b7b71">đặt / hủy sân trên UI</text>
  <text x="60" y="472" font-size="14" fill="#33443a">🧭 Trace hội thoại</text>
  <text x="84" y="492" font-size="12.5" fill="#6b7b71">luồng ReAct · waterfall</text>
  <text x="84" y="510" font-size="12.5" fill="#6b7b71">JSON-RPC · Observation</text>

  <!-- ================= SERVER ================= -->
  <g filter="url(#sh)">
    <rect x="380" y="270" width="240" height="290" rx="14" fill="#ffffff" stroke="#cfd8d2"/>
  </g>
  <rect x="380" y="270" width="240" height="8" rx="4" fill="#3d4a43"/>
  <text x="400" y="306" font-size="12" font-weight="700" fill="#3d4a43" letter-spacing="1">HTTP SERVER</text>
  <text x="400" y="332" font-size="17" font-weight="700" fill="#102017">demo/server.py</text>
  <text x="400" y="352" font-size="12.5" fill="#6b7b71">Python stdlib · đa luồng</text>
  <g font-family="Consolas, monospace" font-size="13" fill="#33443a">
    <text x="400" y="392">POST /api/chat</text>
    <text x="400" y="416">POST /api/book</text>
    <text x="400" y="440">POST /api/cancel</text>
    <text x="400" y="464">GET  /api/schedule</text>
    <text x="400" y="488">GET  /api/trace</text>
    <text x="400" y="512">GET  /api/events</text>
  </g>
  <text x="400" y="536" font-size="12" fill="#6b7b71">chat stream NDJSON · lịch qua SSE</text>

  <!-- ================= AGENT CORE ================= -->
  <g filter="url(#sh)">
    <rect x="720" y="100" width="430" height="570" rx="18" fill="#eaf6ee" stroke="#9fd3b3" stroke-width="1.5"/>
  </g>
  <text x="742" y="132" font-size="12" font-weight="700" fill="#17693f" letter-spacing="1">REACT AGENT CORE</text>
  <text x="742" y="156" font-size="17" font-weight="700" fill="#0b3d25">src/app.py · run_react_agent()</text>
  <rect x="740" y="170" width="390" height="54" rx="10" fill="#ffffff" stroke="#cfe8d8"/>
  <text x="754" y="192" font-size="12.5" fill="#33443a"><tspan font-weight="700">prompts.py</tspan> · system prompt: thông tin sân + quy tắc</text>
  <text x="754" y="212" font-size="12.5" fill="#33443a"><tspan font-weight="700">build_step_prompt</tspan> · câu hỏi + lịch sử Action/Obs</text>

  <!-- Final Answer -->
  <rect x="740" y="250" width="160" height="80" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="820" y="282" font-size="16" font-weight="700" fill="#166534" text-anchor="middle">🏁 Final Answer</text>
  <text x="820" y="304" font-size="12.5" fill="#33443a" text-anchor="middle">trả lời khách</text>
  <text x="820" y="320" font-size="12.5" fill="#33443a" text-anchor="middle">+ ghi trace</text>

  <!-- Thought -->
  <rect x="970" y="250" width="160" height="80" rx="12" fill="#fffbea" stroke="#f59e0b" stroke-width="2"/>
  <text x="1050" y="282" font-size="16" font-weight="700" fill="#a16207" text-anchor="middle">🧠 Thought</text>
  <text x="1050" y="304" font-size="12.5" fill="#33443a" text-anchor="middle">LLM chọn bước tiếp:</text>
  <text x="1050" y="320" font-size="12.5" fill="#33443a" text-anchor="middle">gọi tool hay trả lời</text>

  <!-- Action -->
  <rect x="970" y="450" width="160" height="80" rx="12" fill="#f3edff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1050" y="482" font-size="16" font-weight="700" fill="#6d28d9" text-anchor="middle">🛠 Action</text>
  <text x="1050" y="504" font-size="12.5" fill="#33443a" text-anchor="middle">tool_name</text>
  <text x="1050" y="520" font-size="12.5" fill="#33443a" text-anchor="middle">+ arguments</text>

  <!-- Observation -->
  <rect x="740" y="450" width="160" height="80" rx="12" fill="#eef5ff" stroke="#2563eb" stroke-width="2"/>
  <text x="820" y="482" font-size="16" font-weight="700" fill="#1d4ed8" text-anchor="middle">👁 Observation</text>
  <text x="820" y="504" font-size="12.5" fill="#33443a" text-anchor="middle">JSON kết quả tool</text>
  <text x="820" y="520" font-size="12.5" fill="#33443a" text-anchor="middle">(status + data)</text>

  <!-- loop arrows -->
  <line x1="1050" y1="330" x2="1050" y2="446" stroke="#3d4a43" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1060" y="394" font-size="12.5" fill="#33443a" font-family="Consolas, monospace">tool_call</text>
  <line x1="970" y1="290" x2="904" y2="290" stroke="#17693f" stroke-width="2" marker-end="url(#arrG)"/>
  <text x="937" y="280" font-size="12.5" fill="#17693f" text-anchor="middle" font-family="Consolas, monospace">text</text>
  <path d="M 880 450 C 900 390, 950 360, 985 334" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrB)"/>

  <text x="935" y="646" font-size="13" fill="#17693f" text-anchor="middle" font-weight="600">↻ Lặp tối đa 5 vòng (MAX_ITERATIONS) · emit on_event</text>

  <!-- ================= LLM ================= -->
  <g filter="url(#sh)">
    <rect x="1290" y="100" width="570" height="230" rx="14" fill="#ffffff" stroke="#f5d48a"/>
  </g>
  <rect x="1290" y="100" width="570" height="8" rx="4" fill="#f59e0b"/>
  <text x="1312" y="136" font-size="12" font-weight="700" fill="#a16207" letter-spacing="1">LLM PROVIDER</text>
  <text x="1312" y="162" font-size="17" font-weight="700" fill="#102017">src/providers.py · OpenAIProvider</text>
  <text x="1312" y="192" font-size="14" fill="#33443a">Endpoint OpenAI-compatible (<tspan font-family="Consolas, monospace">OPENAI_BASE_URL</tspan>)</text>
  <text x="1312" y="216" font-size="14" fill="#33443a">Model: <tspan font-family="Consolas, monospace" font-weight="700">ag/gemini-3.6-flash-medium</tspan></text>
  <text x="1312" y="240" font-size="14" fill="#33443a">Native tool calling: gửi 3 tool schema, <tspan font-family="Consolas, monospace">tool_choice=auto</tspan></text>
  <text x="1312" y="270" font-size="13" fill="#6b7b71">Trả về <tspan font-family="Consolas, monospace">tool_call</tspan> (tên tool + arguments) hoặc <tspan font-family="Consolas, monospace">text</tspan></text>
  <text x="1312" y="294" font-size="13" fill="#6b7b71">Hỗ trợ thêm GeminiProvider, MockOfflineProvider (chạy offline)</text>

  <!-- ================= MCP ================= -->
  <g filter="url(#sh)">
    <rect x="1290" y="400" width="570" height="320" rx="14" fill="#ffffff" stroke="#cdb8f5"/>
  </g>
  <rect x="1290" y="400" width="570" height="8" rx="4" fill="#7c3aed"/>
  <text x="1312" y="436" font-size="12" font-weight="700" fill="#6d28d9" letter-spacing="1">MCP SERVER</text>
  <text x="1312" y="462" font-size="17" font-weight="700" fill="#102017">src/mcp_server.py · MCPCourtServer</text>
  <text x="1845" y="436" font-size="13" fill="#6b7b71" text-anchor="end" font-family="Consolas, monospace">JSON-RPC 2.0 · list_tools() / call_tool()</text>

  <g>
    <rect x="1305" y="480" width="173" height="116" rx="10" fill="#f7f3ff" stroke="#ddd0fb"/>
    <text x="1318" y="504" font-size="13.5" font-weight="700" fill="#5b21b6" font-family="Consolas, monospace">court_availability</text>
    <text x="1318" y="526" font-size="13" fill="#33443a">🔎 Tra sân trống</text>
    <text x="1318" y="544" font-size="13" fill="#33443a">theo ngày, khung giờ</text>
    <text x="1318" y="570" font-size="11" fill="#6b7b71" font-family="Consolas, monospace">SUCCESS</text>
    <text x="1318" y="586" font-size="11" fill="#6b7b71" font-family="Consolas, monospace">FULLY_BOOKED</text>
  </g>
  <g>
    <rect x="1488" y="480" width="173" height="116" rx="10" fill="#f7f3ff" stroke="#ddd0fb"/>
    <text x="1501" y="504" font-size="13.5" font-weight="700" fill="#5b21b6" font-family="Consolas, monospace">book_court</text>
    <text x="1501" y="526" font-size="13" fill="#33443a">✅ Đặt 1 sân / 1 giờ</text>
    <text x="1501" y="544" font-size="13" fill="#33443a">trả mã booking + giá</text>
    <text x="1501" y="570" font-size="11" fill="#6b7b71" font-family="Consolas, monospace">SUCCESS</text>
    <text x="1501" y="586" font-size="11" fill="#6b7b71" font-family="Consolas, monospace">SLOT_UNAVAILABLE</text>
  </g>
  <g>
    <rect x="1671" y="480" width="173" height="116" rx="10" fill="#f7f3ff" stroke="#ddd0fb"/>
    <text x="1684" y="504" font-size="13.5" font-weight="700" fill="#5b21b6" font-family="Consolas, monospace">cancel_booking</text>
    <text x="1684" y="526" font-size="13" fill="#33443a">🗑 Hủy theo mã</text>
    <text x="1684" y="544" font-size="13" fill="#33443a">+ SĐT, trước 12 giờ</text>
    <text x="1684" y="570" font-size="11" fill="#6b7b71" font-family="Consolas, monospace">CANCELLED · TOO_LATE</text>
    <text x="1684" y="586" font-size="11" fill="#6b7b71" font-family="Consolas, monospace">NOT_FOUND · PHONE_MISMATCH</text>
  </g>

  <rect x="1305" y="614" width="539" height="88" rx="10" fill="#f1f4f2" stroke="#cfd8d2"/>
  <ellipse cx="1345" cy="646" rx="22" ry="7" fill="#ffffff" stroke="#8f9d94"/>
  <path d="M1323 646 v30 a22 7 0 0 0 44 0 v-30" fill="#ffffff" stroke="#8f9d94"/>
  <text x="1385" y="644" font-size="15" font-weight="700" fill="#102017">src/tools.py · dữ liệu lịch sân</text>
  <text x="1385" y="666" font-size="13" fill="#33443a" font-family="Consolas, monospace">BOOKINGS · BOOKING_RECORDS</text>
  <text x="1385" y="688" font-size="12.5" fill="#6b7b71">4 sân · 06:00–22:00 · giá theo khung giờ (mock data)</text>

  <!-- ================= ARROWS ================= -->
  <!-- CLI -> agent -->
  <line x1="300" y1="160" x2="716" y2="160" stroke="#3d4a43" stroke-width="2" marker-end="url(#arr)"/>
  <!-- UI -> server (chat) -->
  <line x1="300" y1="330" x2="376" y2="330" stroke="#3d4a43" stroke-width="2" marker-end="url(#arr)"/>
  <!-- server -> UI (stream) -->
  <line x1="380" y1="400" x2="304" y2="400" stroke="#17693f" stroke-width="2" marker-end="url(#arrG)"/>
  <!-- server -> UI (SSE) -->
  <line x1="380" y1="500" x2="304" y2="500" stroke="#6d3fd1" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrP)"/>
  <!-- server -> agent -->
  <line x1="620" y1="420" x2="716" y2="420" stroke="#3d4a43" stroke-width="2" marker-end="url(#arr)"/>
  <!-- final -> server -->
  <line x1="740" y1="290" x2="624" y2="290" stroke="#17693f" stroke-width="2" marker-end="url(#arrG)"/>
  <!-- thought -> LLM -->
  <line x1="1130" y1="270" x2="1286" y2="270" stroke="#3d4a43" stroke-width="2" marker-end="url(#arr)"/>
  <!-- LLM -> thought -->
  <line x1="1290" y1="310" x2="1134" y2="310" stroke="#a16207" stroke-width="2" marker-end="url(#arr)"/>
  <!-- action -> MCP -->
  <line x1="1130" y1="490" x2="1286" y2="490" stroke="#6d3fd1" stroke-width="2" marker-end="url(#arrP)"/>
  <!-- MCP -> observation -->
  <polyline points="1290,605 820,605 820,534" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrB)"/>
  <!-- MCP -> server SSE -->
  <polyline points="1290,700 560,700 560,564" fill="none" stroke="#6d3fd1" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrP)"/>
  <!-- server -> MCP direct booking -->
  <polyline points="460,560 460,745 1575,745 1575,724" fill="none" stroke="#3d4a43" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ================= BADGES ================= -->
  <g font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">
    <g transform="translate(508,160)"><circle r="12" fill="#0f5132"/><text y="5">1</text></g>
    <g transform="translate(340,330)"><circle r="12" fill="#0f5132"/><text y="5">1</text></g>
    <g transform="translate(668,420)"><circle r="12" fill="#0f5132"/><text y="5">1</text></g>
    <g transform="translate(1210,270)"><circle r="12" fill="#0f5132"/><text y="5">2</text></g>
    <g transform="translate(1210,310)"><circle r="12" fill="#a16207"/><text y="5">3</text></g>
    <g transform="translate(1210,490)"><circle r="12" fill="#6d28d9"/><text y="5">4</text></g>
    <g transform="translate(1060,605)"><circle r="12" fill="#1d4ed8"/><text y="5">5</text></g>
    <g transform="translate(918,386)"><circle r="12" fill="#1d4ed8"/><text y="5">6</text></g>
    <g transform="translate(680,290)"><circle r="12" fill="#166534"/><text y="5">7</text></g>
    <g transform="translate(340,400)"><circle r="12" fill="#166534"/><text y="5">7</text></g>
    <g transform="translate(900,700)"><circle r="12" fill="#6d28d9"/><text y="5">8</text></g>
    <g transform="translate(340,500)"><circle r="12" fill="#6d28d9"/><text y="5">8</text></g>
    <g transform="translate(1000,745)"><circle r="12" fill="#3d4a43"/><text y="5">B</text></g>
  </g>

  <!-- ================= LEGEND ================= -->
  <g filter="url(#sh)">
    <rect x="40" y="785" width="1820" height="230" rx="16" fill="#ffffff" stroke="#dfe6df"/>
  </g>
  <text x="66" y="822" font-size="17" font-weight="800" fill="#0b3d25">Luồng xử lý một lượt hội thoại</text>
  <g font-size="14.5" fill="#33443a" font-weight="400">
    <g transform="translate(78,858)"><circle r="12" fill="#0f5132"/><text y="5" fill="#fff" font-weight="800" font-size="13" text-anchor="middle">1</text><text x="24" y="5">Khách nhắn trên Web UI (<tspan font-family="Consolas, monospace">POST /api/chat</tspan>) hoặc chạy CLI → gọi <tspan font-family="Consolas, monospace">run_react_agent()</tspan></text></g>
    <g transform="translate(78,896)"><circle r="12" fill="#0f5132"/><text y="5" fill="#fff" font-weight="800" font-size="13" text-anchor="middle">2</text><text x="24" y="5">Gửi LLM: system prompt + câu hỏi + lịch sử Action/Observation + 3 tool schema</text></g>
    <g transform="translate(78,934)"><circle r="12" fill="#a16207"/><text y="5" fill="#fff" font-weight="800" font-size="13" text-anchor="middle">3</text><text x="24" y="5">LLM trả <tspan font-family="Consolas, monospace">tool_call</tspan> (Thought → Action) hoặc <tspan font-family="Consolas, monospace">text</tspan> (→ bước 7)</text></g>
    <g transform="translate(78,972)"><circle r="12" fill="#6d28d9"/><text y="5" fill="#fff" font-weight="800" font-size="13" text-anchor="middle">4</text><text x="24" y="5">Action gọi <tspan font-family="Consolas, monospace">call_tool</tspan> trên MCP Server theo JSON-RPC 2.0</text></g>

    <g transform="translate(990,858)"><circle r="12" fill="#1d4ed8"/><text y="5" fill="#fff" font-weight="800" font-size="13" text-anchor="middle">5</text><text x="24" y="5">Tool đọc/ghi lịch sân, trả Observation (status + dữ liệu)</text></g>
    <g transform="translate(990,896)"><circle r="12" fill="#1d4ed8"/><text y="5" fill="#fff" font-weight="800" font-size="13" text-anchor="middle">6</text><text x="24" y="5">Observation nạp lại vào prompt → quay lại bước 2 (tối đa 5 vòng)</text></g>
    <g transform="translate(990,934)"><circle r="12" fill="#166534"/><text y="5" fill="#fff" font-weight="800" font-size="13" text-anchor="middle">7</text><text x="24" y="5">Final Answer + từng bước trace stream về UI / ghi trace_waterfall.json</text></g>
    <g transform="translate(990,972)"><circle r="12" fill="#6d28d9"/><text y="5" fill="#fff" font-weight="800" font-size="13" text-anchor="middle">8</text><text x="24" y="5">Đặt/hủy thành công → sự kiện SSE → lịch sân cập nhật trực tiếp</text></g>
    <g transform="translate(1600,858)"><circle r="12" fill="#3d4a43"/><text y="5" fill="#fff" font-weight="800" font-size="13" text-anchor="middle">B</text><text x="24" y="5">UI đặt/hủy trực tiếp</text></g>
    <text x="1624" y="882" font-size="13" fill="#6b7b71">/api/book, /api/cancel</text>
    <text x="1624" y="900" font-size="13" fill="#6b7b71">→ cùng MCP Server</text>
  </g>
</svg>
